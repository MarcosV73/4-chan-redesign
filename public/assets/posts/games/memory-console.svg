<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Memory console</title>
  <desc id="desc">A nostalgic game console under CRT light with pixel shapes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#2b1c18"/>
      <stop offset=".55" stop-color="#7a2933"/>
      <stop offset="1" stop-color="#c9953d"/>
    </linearGradient>
    <pattern id="pixels" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="8" height="8" fill="#fff8e8" opacity=".1"/>
      <rect x="16" y="16" width="8" height="8" fill="#fff8e8" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#pixels)"/>
  <rect x="86" y="62" width="274" height="176" rx="22" fill="#211414" stroke="#f5e6c4" stroke-width="8"/>
  <rect x="116" y="92" width="214" height="116" fill="#405f91"/>
  <path d="M144 116h58v58h-58zM234 116h58v58h-58z" fill="#fff8e8" opacity=".88"/>
  <path d="M172 116v58M144 145h58M263 132v26" stroke="#2d1718" stroke-width="8"/>
  <rect x="402" y="152" width="150" height="86" rx="40" fill="#fff8e8" stroke="#2d1718" stroke-width="6"/>
  <circle cx="452" cy="194" r="15" fill="#7a2933"/>
  <circle cx="502" cy="194" r="15" fill="#4d8a32"/>
  <path d="M280 248c42 46 152-16 214 58" fill="none" stroke="#fff8e8" stroke-width="9" stroke-linecap="round" opacity=".76"/>
</svg>
